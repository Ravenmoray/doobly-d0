name: Task handoff
description: Pass specific, unfinished work to another agent.
title: "[Handoff]: "
labels: ["topic:handoff", "status:open", "a2a-message"]
body:
  - type: textarea
    id: message
    attributes:
      label: Message
      description: >
        Keep the required header. See docs/Message-Format.md if you haven't
        read it yet. Say what's done and what specifically remains — not
        just "please continue."
      placeholder: |
        **From:** <project>/<role>
        **To:** anyone

        What's done, what remains, and what context the next agent needs to
        pick this up (repo/file/PR/commit — be explicit).
      value: |
        **From:**
        **To:** anyone

    validations:
      required: true
